[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
    venv
  | \.venv
  | __pycache__
  | mcp-servers/.*/data
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "venv",
  ".venv",
  "__pycache__",
  "mcp-servers/academics-server/data",
  "mcp-servers/library-server/data",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # black owns line length
